## x402
### Technical Deep Dive

**Internet-Native Payments Protocol**  
Metana Bootcamp · July 2026

Note:
Welcome everyone. Today we are going deep on x402 — the protocol that finally gives HTTP a native way to move money.

By the end of this session you should be able to explain the full request lifecycle, the three roles involved, why an agent cannot simply ignore a 402, and how a site tells the difference between a human browser and an AI crawler.

Open your notes app. We will move at a technical pace.

---

## What you will be able to answer

- What problem does x402 actually solve?
- What are the three roles and what does each one do?
- What exactly travels in the three HTTP headers?
- How do the payment schemes differ?
- Why can’t an agent just bypass the paywall?
- What happens when a normal human opens the same URL in Chrome?
- How does a website know the request came from an agent?

Note:
These are the questions I want you to be able to answer confidently after today. If any of them still feel fuzzy at the end, stop me.

---

## The gap HTTP left open

HTTP was designed to move **information**.  
It had no first-class primitive to move **value**.

In the early specs they reserved status code **402 Payment Required**.  
Then almost nobody standardized it for roughly thirty years.

Everything we use today — API keys, subscriptions, Stripe checkouts, rate-limit dashboards — is a workaround for that missing piece.

Note:
This is the historical context. Spend about one minute here. The key sentence is: “HTTP could move information but not value.” Everything else in the talk is the attempt to fix that.

---

## What x402 actually is

x402 is an open protocol that turns the old 402 status code into a real, programmable payment negotiation layer.

A client requests a resource.  
If payment is required, the server answers with 402 and machine-readable payment instructions.  
The client pays, proves it, and retries.  
Only then does the server release the content.

No accounts. No API keys. No sessions. Just HTTP + cryptographic proof of payment.

Note:
Say this slowly. This is the one-sentence definition students should remember: “402 plus machine-readable payment instructions plus cryptographic proof.”

---

## The three roles

| Role | What it does |
|------|--------------|
| **Client** | Asks for the resource, chooses a payment option, signs the payload |
| **Resource Server** | Protects the route, issues the 402, decides when to release content |
| **Facilitator** | Checks the signature and settles the payment on-chain |

The Resource Server does **not** have to run its own blockchain node. That is the point of the Facilitator.

Note:
Draw three boxes on the board if you can. Label them Client, Resource Server, Facilitator. Students very often mix up the Resource Server and the Facilitator. Clarify that the Facilitator is optional infrastructure that handles the blockchain parts.

---

## Full lifecycle — first half

```text
Client                     Resource Server
  │                              │
  │ 1. GET /resource             │
  │─────────────────────────────>│
  │                              │
  │ 2. 402 + PAYMENT-REQUIRED    │
  │<─────────────────────────────│
  │                              │
  │ 3. Choose one option         │
  │ 4. Build + sign payload      │
  │                              │
  │ 5. GET /resource again       │
  │    + PAYMENT-SIGNATURE       │
  │─────────────────────────────>│
```

Note:
Walk through this left to right. Emphasize that after step 2 the client has received almost no useful content — only the payment challenge. The real work starts when the client comes back with a signature.

---

## Full lifecycle — second half

```text
Resource Server                  Facilitator
      │                               │
      │ 6. POST /verify               │
      │──────────────────────────────>│
      │ 7. “yes, signature is valid”  │
      │<──────────────────────────────│
      │                               │
      │ 8. POST /settle               │
      │──────────────────────────────>│
      │ 9. transaction on-chain       │
      │                    ──────────>│ chain
      │ 10. settlement proof          │
      │<──────────────────────────────│
      │                               │
Client│                               │
  │ 11. 200 + actual content          │
  │     + PAYMENT-RESPONSE            │
  │<──────│
```

Note:
This is the enforcement point. Notice that the content only appears in step 11 — after verification and settlement. Steps 6 through 10 can be short-circuited if the Resource Server decides to talk to the chain itself. That is called self-facilitation.

---

## The three headers

Everything important travels in three headers. All values are Base64-encoded JSON.

| Header | Direction | When it appears | What it carries |
|--------|-----------|-----------------|-----------------|
| `PAYMENT-REQUIRED` | Server → Client | With the 402 | The payment options |
| `PAYMENT-SIGNATURE` | Client → Server | On the retry | The signed proof |
| `PAYMENT-RESPONSE` | Server → Client | With the 200 | Settlement receipt |

They chose headers instead of the body so that existing CDNs, proxies, and middleware keep working without changes.

Note:
Ask the room: “Why not put this information in the JSON body?”  
The answer is compatibility. Headers survive more intermediaries and leave the body free for the actual resource the client asked for.

---

## PaymentRequired (what the server sends)

```json
{
  "x402Version": 1,
  "accepts": [
    {
      "scheme": "exact",
      "network": "eip155:8453",
      "maxAmountRequired": "1000",
      "asset": "0x833589fC...",
      "payTo": "0xYourTreasury...",
      "description": "Weather data"
    }
  ]
}
```

`accepts` is an array. The server can offer several combinations of scheme, network, and price. The client picks one it can fulfill.

Note:
Point at the `accepts` array. This is how multi-chain support works in practice. One endpoint can simultaneously accept USDC on Base and SOL on Solana.

---

## PaymentPayload (what the client sends back)

```json
{
  "x402Version": 1,
  "scheme": "exact",
  "network": "eip155:8453",
  "payload": {
    "signature": "0x...",
    "authorization": { /* EIP-3009 or Permit2 data */ }
  },
  "accepted": { /* the requirement it chose */ }
}
```

The outer shape is common.  
The inner `payload` is scheme-specific and network-specific.

Note:
This separation is deliberate. New payment schemes can be added later without breaking the outer envelope that every client and server already understands.

---

## Schemes — the real economic logic

A scheme answers three questions:
- How does the client authorize the payment?
- What must the Facilitator check?
- When do the funds actually move?

| Scheme | When money moves | Typical use |
|--------|------------------|-------------|
| `exact` | Immediately | Fixed-price API call |
| `upto` | Immediately, up to a cap | Metered or streaming usage |
| `batch-settlement` | Later, in batches | Extremely high volume of tiny payments |

Note:
Most production traffic today uses `exact`. The other two exist for more advanced cases. We will look at each briefly.

---

## Scheme: exact

Client pays a precise amount right now.

On EVM with USDC the usual path is:
1. Client creates an EIP-3009 `transferWithAuthorization` signature (or a Permit2 signature)
2. That signature goes into the PaymentPayload
3. Facilitator submits it on-chain
4. Funds move from the client to the `payTo` address in a single transaction

The payment is atomic and final.

Note:
EIP-3009 is popular because the end user does not need gas in the payment token. The Facilitator or a relayer pays the gas. That removes a lot of friction for agents.

---

## Scheme: upto

Client authorizes a **maximum** amount.  
The seller can later settle any amount less than or equal to that maximum based on actual usage.

This fits streaming responses, pay-per-token LLM generation, or long-running agent tool calls.

The signature still happens up front. Only the final settled amount is chosen later.

Note:
Think of it as a temporary credit line rather than a classic one-shot payment. Useful when you do not know the exact cost before the work is done.

---

## Scheme: batch-settlement

Built for very high volumes of tiny payments.

Rough idea:
1. Client authorizes or deposits into an escrow / voucher system
2. Many small off-chain vouchers are issued, one per request
3. The seller periodically redeems a whole batch on-chain

This dramatically lowers the per-request on-chain cost, at the price of more complexity.

Note:
Only go deeper here if the cohort is already comfortable with the first two schemes. Most students will never implement batch-settlement themselves.

---

## Facilitator endpoints

Two core calls:

**POST /verify**  
“Is this signature valid for this requirement?”  
Returns `{ isValid: true/false }`

**POST /settle**  
“Please execute the payment on-chain.”  
Returns the transaction hash and network.

A Resource Server can call these, or it can self-facilitate and talk to the chain directly.

Note:
The protocol rule is important: the Facilitator must not move funds except according to the client’s signed intent. It is meant to be trust-minimized infrastructure, not a custodian that can do whatever it wants.

---

## Networks and CAIP-2

x402 identifies chains with CAIP-2 identifiers:

```text
eip155:1        → Ethereum mainnet
eip155:8453     → Base mainnet
eip155:84532    → Base Sepolia
solana:5eykt4…  → Solana mainnet
```

A scheme is always implemented for a concrete pair `(scheme, network)`.  
Supporting `exact` on Base is a different code path from supporting `exact` on Solana.

Note:
This is why the TypeScript SDKs ship separate packages such as `@x402/evm` and `@x402/svm`. The cryptography and transaction formats are not the same.

---

## How an agent is prevented from bypassing the paywall

This is the question many of you asked.

The content is never sent until payment is verified.

```text
Agent → GET /article
Server → 402 + payment challenge   ← body is empty or nearly empty

Agent → GET /article + valid PAYMENT-SIGNATURE
Server → verifies → settles → 200 + full content
```

There is no HTML to strip, no JavaScript paywall to disable, no cookie to forge.  
The bytes of the article simply do not leave the server until the cryptographic proof is accepted.

Note:
Pause here. This is the most important security insight in the whole talk. Traditional web paywalls send the content and then try to hide it. x402 never sends the content in the first place.

---

## Common bypass attempts and why they fail

| Attempt | Why it fails |
|---------|--------------|
| Ignore the 402 and keep requesting | Server keeps answering 402. No content is ever returned. |
| Spoof a normal browser User-Agent | Payment is required by cryptographic proof, not by User-Agent. |
| Replay an old signature | Nonces and unique authorizations make replays invalid. |
| Hit the origin server directly | Origin should only accept traffic from Cloudflare (or your own edge). |
| Use residential proxies | Again, payment proof is independent of IP address. |

Note:
Walk through two or three of these. The pattern is always the same: the enforcement point is the absence of content, not a soft client-side check.

---

## What if a human opens the same URL in a browser?

It depends on how the site is configured.

**Cloudflare Pay Per Crawl** (the product many of you saw in the links) is aimed at AI crawlers. Normal Chrome or Firefox visitors are usually treated as humans and receive a normal 200 with the full page.

**Pure x402 endpoints** give the site owner a choice:
- Charge only agents (most common)
- Charge everyone
- Show humans a classic Stripe-style checkout while agents speak x402

A normal browser that hits a pure 402 endpoint just sees an empty or error-like page, because browsers do not understand the payment headers and cannot automatically pay with a wallet.

Note:
The design goal is a parallel payment rail for machines that does not break the existing human web. That is why most production deployments leave ordinary browsers alone.

---

## How does the website know it is an agent?

Several signals are combined:

1. **User-Agent string** — many AI crawlers openly identify themselves (`GPTBot`, `ClaudeBot`, `Google-Extended`, etc.)
2. **Cryptographic bot authentication** — newer standard where legitimate AI companies sign their requests
3. **Behavioral and ML signals** — rate, TLS fingerprint, missing browser headers, headless-browser tells
4. **IP / ASN reputation** — data-center ranges versus residential ISPs
5. **Protocol participation** — if the client sends `PAYMENT-SIGNATURE` or MPP headers, it has already declared itself a machine

Cloudflare’s AI Crawl Control uses the first four at global scale.  
Once a client speaks x402 or MPP, the fifth signal becomes definitive.

Note:
Be honest with the class: detection is never perfect against a determined adversary. That is exactly why payment is stronger than pure blocking. Even a perfect human mimic still has to pay if the content is gated by a real payment requirement.

---

## Security properties the protocol gives you

- Client cannot be charged more than the amount it signed
- Replay protection through nonces and unique authorizations
- Resource Server never sees the client’s private key
- Facilitator is constrained by the signed intent

What you still have to design for:
- Facilitator availability and honesty
- Correct amount, asset, and recipient in the requirement
- Authorization expiry
- Whether you self-facilitate or trust an external one

Note:
Ask the room: “Who is actually trusted in this system?”  
The cryptography protects the amounts. The Facilitator is trusted for liveness and correct settlement, which is why many teams eventually run their own or use multiple.

---

## Resource Server checklist

1. Unprotected request → respond 402 + well-formed `PAYMENT-REQUIRED`
2. Request that carries `PAYMENT-SIGNATURE` → call `/verify`
3. If valid → call `/settle` (or settle yourself)
4. On successful settlement → return the resource + `PAYMENT-RESPONSE`
5. On any failure → return 402 again

Never release the resource before settlement is confirmed when you are using the `exact` scheme.

Note:
This five-step list is what I want students to be able to recite if they implement a seller. It is the minimal correct behavior.

---

## Client checklist

1. Notice the 402
2. Decode `PAYMENT-REQUIRED`
3. Pick one entry from `accepts`
4. Build the scheme-specific payload
5. Sign it with the wallet
6. Retry the original request with `PAYMENT-SIGNATURE`
7. Optionally read `PAYMENT-RESPONSE` for accounting

Libraries such as `@x402/fetch` collapse most of this into a single call. You still need to understand the steps when something breaks.

Note:
Debugging almost always means looking at the raw headers. Encourage students to base64-decode a real `PAYMENT-REQUIRED` and a real `PAYMENT-SIGNATURE` at least once.

---

## Current SDKs and a sensible learning path

- TypeScript: `@x402/core`, `@x402/evm`, `@x402/svm`, plus Express / Hono / Next adapters
- Python: `x402` package
- Go: official module in the foundation repository

Suggested order:
1. Read the `exact` scheme specification for EVM
2. Run the seller quickstart
3. Decode real headers yourself
4. Add a second network or try the `upto` scheme

Note:
The fastest way to demystify the protocol is to watch the headers in the network tab or with curl while a payment succeeds.

---

## Design choices worth remembering

- Headers instead of body → maximum compatibility with existing HTTP infrastructure
- Scheme separated from network → payment logic and chain support can evolve independently
- Optional Facilitator → simple cases can self-facilitate; high-volume cases can outsource
- Base64 → safe transit through any intermediary that might mangle raw JSON in headers

Note:
These four decisions explain most of the shape of the protocol. They are good discussion or exam material.

---

## Honest limitations today

- No protocol-level refunds — payments are push and final
- Discovery of paid endpoints is still early
- Fiat on-ramps and gas sponsorship live at the Facilitator layer, not in the core protocol
- Complex pricing models need extra logic on top of the basic schemes
- Cross-chain atomicity is out of scope

Note:
Students respect realism. State the limitations cleanly and move on. The protocol is useful today even with these constraints.

---

## Key takeaways

1. x402 is a negotiation and authorization protocol layered on HTTP 402
2. Three headers carry the entire state
3. Schemes define how money moves; networks define where
4. The content is simply not sent until payment is verified — that is the real enforcement
5. Detection of agents is useful, but cryptographic payment is stronger than detection alone

Note:
Repeat the fourth point. It is the one that answers the bypass question cleanly.

## Discussion questions

- How would you design a scheme for streaming LLM token billing?
- Should Facilitators sponsor gas by default?
- What is the correct behavior if the Facilitator goes offline after `/verify` but before `/settle`?
- When is self-facilitation safe, and when is it a bad idea?
- How would you combine x402 for agents with a normal Stripe checkout for human visitors?

Note:
These questions force students to apply the model instead of just repeating definitions. Use them to close the session or as take-home thinking prompts.
